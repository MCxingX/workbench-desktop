appId: com.yg.workbench
productName: Workbench
copyright: Copyright © 2026 YG

# zip 免解压版的名字带上版本号，收到新版不会跟旧的混在一起
artifactName: Workbench-${version}-绿色版.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  # sql.js 只用到 sql-wasm.wasm + sql-wasm.js，其余 20 多 MB 是 asm.js 变体和调试版，
  # 被打进包只会让 portable 每次启动多解压一堆没用的文件（启动变慢、CPU 拉满）
  - '!**/node_modules/sql.js/dist/sqljs-all.zip'
  - '!**/node_modules/sql.js/dist/sql-asm*'
  - '!**/node_modules/sql.js/dist/worker*'
  - '!**/node_modules/sql.js/dist/sql-wasm-inline*'
  - '!**/node_modules/sql.js/dist/*-debug.*'
  - '!**/node_modules/sql.js/dist/sql-wasm-browser*'
  - '!**/node_modules/sql.js/**/*.md'
  - '!**/node_modules/sql.js/**/*.ts'

asar: true
asarUnpack:
  # 只解包真正要用的两个文件。原先是整包 sql.js/**（30MB），
  # portable 每次启动都要把它们解到 %TEMP%，白白多花时间和 CPU
  - '**/node_modules/sql.js/dist/sql-wasm.wasm'
  - '**/node_modules/sql.js/dist/sql-wasm.js'

# 实测（同机同会话，各测三次）：
#   store   → 启动 4.5s / 9.4s / 4.5s，exe 286MB   ← 采用
#   normal  → 启动 8.8s / 12.5s / 12.2s，exe 72.7MB
#   maximum → 更慢（原配置），解压时单核跑到 141%
# portable 每次启动都要把包解到 %TEMP%，压缩率越高解压越慢、CPU 越满。
# 本地工具多占几百 MB 硬盘，换每次启动省 4-8 秒、不占满 CPU，是划算的。
compression: store
removePackageScripts: true

win:
  target:
    # ── 推荐发这个 ──
    # zip：解压一次，之后双击 Workbench.exe 秒开（4-5 秒），连点几下也不会坏。
    # 实测对比（各连点 3 次、间隔 2-3 秒）：
    #   免解压版 → 主进程 1 个、4 进程共 387MB            正常
    #   portable → 主进程 0 个、3 个孤儿启动器、1.5GB 残留  崩了
    - target: zip
      arch:
        - x64
    # portable：单个 exe、双击即用，适合临时发给别人试一下。
    # 代价：每次启动都要完整解压一遍，而且 electron-builder 的 NSIS 模板里
    # 第 38 行是 `RMDir /r $INSTDIR`（先删再解压），没有"已解压就跳过"的机制 ——
    # 所以连点两下会让两个启动器同时删+解压同一个目录，文件互相覆盖，
    # 解出来的 app.asar 是残缺的，程序起不来还留一堆空转的启动器。
    # 这个在我们代码之外，应用层修不了，只能靠"推荐用 zip 版"绕开。
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker

portable:
  # 固定文件名：新版本直接覆盖同一个 exe，桌面/快捷方式不用跟着改，
  # 版本号在应用标题和关于页里，不在文件名里
  artifactName: Workbench-portable.exe
  # 解压目录必须带版本号。原来固定叫 Workbench 会出两个真问题：
  #  1) 别人机器上留着旧版本解出的 %TEMP%\Workbench，新 exe 往同一个目录解压，
  #     旧 app.asar 被占用/没解全 → 一点按钮就报 ENOENT …\package.json
  #  2) 连点两下时两个启动器同时往同一目录解压，文件互相覆盖 → 解出的包是残缺的
  # 带版本号后新版本永远解到自己的目录；旧目录由启动清理负责删（见 cleanOldUnpackDirs）。
  unpackDirName: Workbench-${version}
