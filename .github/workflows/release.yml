name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 不写 ref：tag 触发时取 tag 指向的那份代码，
          # 写了 ref: main 会改成"现在 main 的最新"，产物与版本号可能对不上
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npx vitest run

      # 冒烟测试要开真实 Electron 窗口点按钮，CI 的无桌面环境跑不稳，本地跑
      - name: 打包
        run: npm run build && npx electron-builder --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 生成 version.json
        run: node scripts/release.mjs

      - name: 把清单提交回 main（更新器从这里读）
        # 并发友好：别的任务可能刚推过 main（同一 tag 重跑 / 连续两次构建），
        # 直接 push 会被 "fetch first" 拒绝。
        # 做法：在一个临时克隆里操作（基线永远是远程最新的 main），只改 version.json。
        # 不在本工作区切分支 —— 后面的发布步骤还要读 release\*.exe，切了会把它弄丢。
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN_FOR_PUSH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 注意：这里不能设 ErrorActionPreference=Stop ——
          # git 把进度写到 stderr，Stop 会把它当成致命错误，明明成功了也判失败。
          $sync = Join-Path $env:RUNNER_TEMP 'manifest-sync'
          if (Test-Path $sync) { Remove-Item $sync -Recurse -Force }
          $url = "https://x-access-token:$env:GH_TOKEN_FOR_PUSH@github.com/$env:GITHUB_REPOSITORY.git"

          for ($i = 1; $i -le 5; $i++) {
            if (Test-Path $sync) { Remove-Item $sync -Recurse -Force }
            git clone --depth 1 --branch main $url $sync 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Host "克隆失败，重试"; Start-Sleep -Seconds 5; continue }

            Copy-Item 'release\version.json' (Join-Path $sync 'release\version.json') -Force
            Push-Location $sync
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f release/version.json
            git commit -m "chore: version.json for ${{ github.ref_name }}" 2>&1 | Out-Null
            $changed = $LASTEXITCODE -eq 0
            if (-not $changed) { Pop-Location; Write-Host "清单无变化，跳过"; exit 0 }

            git push origin HEAD:main 2>&1 | Out-Null
            $pushed = $LASTEXITCODE -eq 0
            Pop-Location
            if ($pushed) { Write-Host "清单已提交回 main（第 $i 次尝试）"; exit 0 }
            Write-Host "第 $i 次推送被拒，重试中"
            Start-Sleep -Seconds 5
          }
          Write-Host "清单推送最终失败（产物已上传，不影响发布）"
          exit 0

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/Workbench-portable.exe
            release/*绿色版.zip
            release/version.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
