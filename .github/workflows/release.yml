name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npx vitest run

      # 冒烟测试要开真实 Electron 窗口点按钮，CI 的无桌面环境跑不稳，本地跑
      - name: 打包
        run: npm run build && npx electron-builder --win portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 生成 version.json
        run: node scripts/release.mjs

      - name: 把清单提交回 main（更新器从这里读）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/version.json
          git commit -m "chore: version.json for ${{ github.ref_name }}" || exit 0
          git push origin HEAD:main

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Workbench-portable.exe
            release/version.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
