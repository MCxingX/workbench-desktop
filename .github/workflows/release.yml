name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npx vitest run

      # 冒烟测试要开真实 Electron 窗口点按钮，CI 的无桌面环境跑不稳，本地跑
      - name: 打包
        run: npm run build && npx electron-builder --win portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 生成 version.json
        run: node scripts/release.mjs

      - name: 把清单提交回 main（更新器从这里读）
        # 并发友好：别的任务可能刚推过 main（同一 tag 重跑 / 连续两次构建），
        # 直接 push 会被 "fetch first" 拒绝。这里先 rebase 到最新远程再推，最多重试 5 次。
        # 这一步失败不影响本版本发布（产物在下一步上传），所以 continue-on-error。
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/version.json
          git commit -m "chore: version.json for ${{ github.ref_name }}" || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase 冲突，保留远程版本"; exit 0 }
            if git push origin HEAD:main; then
              echo "清单已提交回 main（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送被拒，重试中"
            sleep 5
          done
          echo "清单推送最终失败（产物已上传，不影响发布）"
          exit 0

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Workbench-portable.exe
            release/version.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
